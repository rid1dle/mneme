name: Release

# Push a tag like v0.4 (scripts/release does it) to test, build, sign and publish that version. Every copy of Mneme
# finds it through the release's update.json. Run it by hand for a dry run: same steps, nothing published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the app's version
        if: github.ref_type == 'tag'
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::The tag is $GITHUB_REF_NAME but Info.plist says $v"; exit 1; }

      - name: Test
        run: ./build.sh test

      - name: Release notes from the tag's message
        run: |
          mkdir -p build
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d' > build/notes.md
          else
            echo "Dry run of $(git rev-parse --short HEAD)." > build/notes.md
          fi

      - name: Build, zip and sign
        env:
          MNEME_UPDATE_KEY: ${{ secrets.MNEME_UPDATE_KEY }}
          MNEME_NOTES_FILE: build/notes.md
        run: ./build.sh release

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          {
            cat build/notes.md
            echo
            echo "Install: unzip, move Mneme.app to Applications, then right-click > Open the first time (it is not notarized). Allow Accessibility when asked."
            echo "Already have Mneme 0.4 or later? It updates itself."
            echo
            echo "SHA-256 of the zip: $(shasum -a 256 build/release/Mneme-$v-arm64.zip | cut -d' ' -f1)"
          } > build/release-notes.md
          gh release create "$GITHUB_REF_NAME" build/release/Mneme-$v-arm64.zip build/release/update.json \
            --verify-tag --title "Mneme $v" --notes-file build/release-notes.md

      - name: Keep the dry run's files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mneme-release
          path: build/release
